# Every pull request, and every push to main.
#
# No secrets are used anywhere in this file, on purpose: it has to run on a
# fork's pull request, and a workflow that needs a signing certificate to tell
# you whether the code compiles is a workflow that tells contributors nothing.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read, and nothing else. A check does not write anywhere.
permissions:
  contents: read

concurrency:
  # One run per branch. Pushing three times in a minute should not hold three
  # macOS runners.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      # No `version:` here on purpose. `packageManager` in the root
      # package.json is the single source, and this action fails outright when
      # both name a version — which is exactly how it failed.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One turbo invocation: it knows the dependency order between the
      # packages and will not run a package's tests before its deps are built.
      - run: pnpm turbo run typecheck test build

  package:
    name: unsigned build
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # No `version:` here on purpose. `packageManager` in the root
      # package.json is the single source, and this action fails outright when
      # both name a version — which is exactly how it failed.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # arm64 only here. Both architectures on every PR is forty minutes of
      # runner to prove something the release build proves again anyway; this
      # exists to catch a packaging change that breaks the build, and one arch
      # catches that.
      - name: collect the bundled tools
        run: pnpm --filter lirovo-desktop exec node scripts/collect-binaries.mjs --arm64

      - name: build an unsigned app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # Through turbo, not `pnpm --filter … build`. The filter form runs
          # ONLY the desktop build, so @lirovo/{contracts,core,node-runtime}
          # never emit their .d.ts and `tsc --noEmit` cannot resolve a single
          # one of them. turbo honours `dependsOn: ["^build"]` and builds them
          # first.
          pnpm turbo run build --filter=lirovo-desktop
          pnpm --filter lirovo-desktop exec electron-builder --mac --arm64 --publish never

      # Downloadable from the run. Unsigned, so it will not launch without the
      # user overriding Gatekeeper — which is the honest state of a PR build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lirovo-arm64-unsigned
          path: apps/desktop/release/*.dmg
          retention-days: 7
          if-no-files-found: error

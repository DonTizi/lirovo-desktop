# Production versions, from the commit messages that are already being written.
#
# release-please keeps one open PR that accumulates every conventional commit
# on main into a changelog and a version bump. Merging that PR is the single
# manual gesture that means "ship this" — and it creates a normal GitHub
# release, which is what `release.yml` reacts to, which is what lands on the
# `latest` channel.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest

    # Same reasoning as the signing secrets in release.yml: a token that can
    # push code and cut releases feeds straight into the pipeline that holds
    # the Developer ID, so it does not sit at repository scope where any
    # workflow that reaches main can read it.
    environment: release-please
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # A PAT, not GITHUB_TOKEN. A release created by GITHUB_TOKEN does not
          # trigger another workflow, so `release.yml` would never fire and the
          # release would sit there with no binaries attached.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
